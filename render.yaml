services:
  - type: web
    name: teahousevilla
    env: python
    plan: free
    buildCommand: >
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: teahousevilla.onrender.com,teahousevillagalle.com,www.teahousevillagalle.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://teahousevilla.onrender.com,https://teahousevillagalle.com,https://www.teahousevillagalle.com
      - key: OTA_SYNC_ENABLED
        value: "False"
      - key: OTA_EXPORT_ENABLED
        value: "False"

  - type: cron
    name: teahousevilla-ota-sync
    env: python
    schedule: "*/15 * * * *"
    buildCommand: >
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: python manage.py refresh_availability
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: OTA_SYNC_ENABLED
        value: "False"
