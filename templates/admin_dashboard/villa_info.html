{% extends 'admin_dashboard/base.html' %}{% block title %}Villa Information{% endblock %}{% block heading %}Villa information{% endblock %}{% block content %}<form method="post" class="admin-panel">{% csrf_token %}<div class="detail-grid"><label>Name<input class="form-control" name="name" value="{{ property.name }}"></label><label>Tagline<input class="form-control" name="tagline" value="{{ property.tagline }}"></label><label>Address<input class="form-control" name="address" value="{{ property.address }}"></label><label>Phone<input class="form-control" name="phone_number" value="{{ property.phone_number }}"></label><label>WhatsApp<input class="form-control" name="whatsapp_number" value="{{ property.whatsapp_number }}"></label><label>Email<input class="form-control" name="email" value="{{ property.email }}"></label><label>Check-in time<input class="form-control" type="time" name="check_in_time" value="{{ property.check_in_time|time:'H:i' }}"></label><label>Check-out time<input class="form-control" type="time" name="check_out_time" value="{{ property.check_out_time|time:'H:i' }}"></label><label>Maximum guests<input class="form-control" type="number" name="max_guests" value="{{ property.max_guests }}"></label><label>Google Maps link<input class="form-control" name="google_maps_url" value="{{ property.google_maps_url }}"></label></div><label style="display:block;margin-top:20px">Short description<textarea class="form-control" name="short_description" rows="3">{{ property.short_description }}</textarea></label><label style="display:block;margin-top:20px">Full description<textarea class="form-control" name="full_description" rows="6">{{ property.full_description }}</textarea></label><label style="display:block;margin-top:20px">House rules<textarea class="form-control" name="house_rules" rows="4">{{ property.house_rules }}</textarea></label><button class="button" style="margin-top:22px" type="submit">Save changes</button></form>{% endblock %}
