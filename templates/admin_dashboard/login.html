{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="{% static 'css/admin-dashboard.css' %}"></head><body class="admin-body"><main class="login-page"><form method="post" class="login-card">{% csrf_token %}<span class="eyebrow-admin">Tea House Villa</span><h1>Welcome back</h1><p style="color:#718086">Sign in to manage your villa.</p>{% if form.non_field_errors %}<div style="color:#a64848;margin-top:16px">{{ form.non_field_errors }}</div>{% endif %}<label for="{{ form.username.id_for_label }}">Username or email</label>{{ form.username }}<label for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}<button class="button" type="submit">Log in</button></form></main></body></html>
